name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-lint:
    name: Unit tests and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests, lint fixtures, and the lint over every program
        run: cargo test --locked
      - name: Lint every SimplicityHL program outside the reject fixtures
        run: |
          cargo build --locked --quiet --bin seqc
          seqc=target/debug/seqc
          # Programs: both layers, so each must compile.
          $seqc lint $(git ls-files '*.simf' | grep -v -e '^lints/fixtures/' -e '^helpers/') \
            lints/fixtures/accept/*.simf
          # Simplex projects: compiled with their dependency map.
          $seqc lint --project lints/fixtures/accept/import
          # Fragments that are not programs alone: helpers and templates.
          $seqc lint --source-only helpers/*.simf $(git ls-files '*.simf.in')
      - name: The reject fixtures fail the lint
        run: |
          seqc=target/debug/seqc
          for f in lints/fixtures/reject/*.simf; do
            if $seqc lint "$f"; then echo "$f passed the lint"; exit 1; fi
          done
          if $seqc lint --project lints/fixtures/reject/import; then
            echo "the import fixture passed the lint"; exit 1
          fi
          if $seqc lint lints/fixtures/reject/import/simf/native_asset.simf; then
            echo "a program the lint cannot compile passed it"; exit 1
          fi

  mirrors:
    name: Address mirrors (Python, JavaScript, Go) against the golden vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Python
        run: python3 mirrors/python/test_sequentia_address.py -v
      - name: JavaScript
        run: node --test mirrors/js/sequentia-address.test.mjs
      - name: Go
        working-directory: mirrors/go
        run: |
          go vet ./...
          go test -v ./...

  parity:
    name: Parity gate against the node's Simplicity library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The node repository is public. Only its src/simplicity directory is
      # fetched, from the tip of its default branch, so a subtree update in the
      # node that diverges from the pinned compiler fails this job.
      - uses: actions/checkout@v4
        with:
          repository: ConcatenaLabs/Sequentia
          ref: master
          path: node
          sparse-checkout: src/simplicity
          sparse-checkout-cone-mode: true
      - name: Record the node commit compared
        run: git -C node log -1 --format='node %H %cs'
      - name: Fetch the pinned crates
        run: cargo fetch --locked
      - name: Compare the C sources
        run: python3 parity/parity_gate.py --node node/src/simplicity

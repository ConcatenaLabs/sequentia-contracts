[package]
name = "mint-limiter"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Builds and signs spends of the sequentia/mint-limiter covenant, for the bridges that mint through it."

[[bin]]
name = "mint-limiter"
path = "src/main.rs"

[dependencies]
# The framework: programs, contract trees, the contract key, the budget rule.
smplx-sdk = { git = "https://github.com/ConcatenaLabs/smplx", rev = "57dd57f686dd21e47ec8b7af7b6e19d33bef7829" }
# The pinned compiler, the descriptor reader and the mint_limiter template, from
# this checkout, so the tool always builds the template it sits beside.
sequentia-contracts = { path = "../../crates/sequentia-contracts" }
serde_json = "1"

# Sequentia's transaction encoding, as smplx declares it: a project depending on
# smplx declares the same patch, naming the same SWK commit (smplx's SEQUENTIA.md).
[patch.crates-io]
elements = { git = "https://github.com/ConcatenaLabs/SWK", rev = "87a9f5e7f98356a2c00712884019079566aacfec" }

[profile.release]
debug = false

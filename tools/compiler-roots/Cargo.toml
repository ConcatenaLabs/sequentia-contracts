[package]
name = "compiler-roots"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Compile the same programs under SimplicityHL 0.4.1 and the pinned compiler and report their commitment roots"

# Its own workspace: it links a second compiler, which must stay out of the
# main lock file (the parity gate expects exactly one simplicity-sys there).
[workspace]

[dependencies]
sequentia-contracts = { path = "../../crates/sequentia-contracts" }
simplicityhl041 = { package = "simplicityhl", version = "=0.4.1" }
serde_json = "1"
